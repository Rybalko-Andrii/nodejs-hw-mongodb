<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 20px;
        color: #333;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #2c3e50;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background-color: #4facfe;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="email-container">
      <h1>Hello, {{name}}!</h1>
      <p>
        We received a request to reset your
        password. To proceed, please click the
        button below:
      </p>
      <a href="{{link}}" class="button"
        >Reset Password</a
      >
      <p>
        If you didn’t request a password reset,
        you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
